name: Ignis CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  rust-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Run Rust unit tests (BPE, SentencePiece, JSON Schema DFA, TokenFSM)
        run: cargo test --manifest-path tokenizer/Cargo.toml
      - name: Build ignis_tokenizer.wasm (release)
        run: |
          cd tokenizer
          cargo build --target wasm32-unknown-unknown --release
          cp target/wasm32-unknown-unknown/release/ignis_tokenizer.wasm ../runtime/wasm/ignis_tokenizer.wasm

  audit-and-packages:
    runs-on: ubuntu-latest
    needs: rust-wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Static W3C WGSL Audit & WASM Tokenizer/FSM Offline Smoke
        run: npm run audit:wgsl
      - name: Cross-platform Tokenizer Test (CI Fixture)
        run: npm run test:tokenizer
      - name: Verify Self-Contained npm Packages (ignis-webgpu & ignis-webgpu-packer)
        run: npm run pack:check

  demo-static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install chat-vinext dependencies
        run: npm --prefix examples/chat-vinext install
      - name: TypeScript type check
        run: npx --prefix examples/chat-vinext tsc -p examples/chat-vinext/tsconfig.json --noEmit
      - name: Build Cloudflare Pages static export
        env:
          NEXT_PUBLIC_IGNIS_CDN_BASE: ${{ vars.IGNIS_CDN_BASE || 'https://ignis-models.ray-d-song.com' }}
        run: npm run build:demo:pages
      - name: Verify static export artifacts
        run: |
          test -f examples/chat-vinext/out/index.html
          test -f examples/chat-vinext/out/_headers
          test -f examples/chat-vinext/out/ignis/runtime/ignis-worker.mjs
          test -f examples/chat-vinext/out/ignis/runtime/wasm/ignis_tokenizer.wasm
          test -f examples/chat-vinext/out/samples/demo-shapes.png
          test -f examples/chat-vinext/out/samples/demo-tone.wav
      - name: Upload Cloudflare Pages static artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-vinext-pages-out
          path: examples/chat-vinext/out
          retention-days: 1

  deploy-pages:
    runs-on: ubuntu-latest
    needs: [rust-wasm, audit-and-packages, demo-static-build]
    if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && github.repository == 'Ray-D-Song/ignis'
    concurrency:
      group: deploy-cloudflare-pages
      cancel-in-progress: true
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check Cloudflare Pages deployment secrets
        id: cf_auth
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Cloudflare Pages auto-deploy: add CLOUDFLARE_API_TOKEN repository secret (Account -> Cloudflare Pages: Edit) to activate automatic deployment on push to main."
          fi
      - name: Download built static export
        if: steps.cf_auth.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: chat-vinext-pages-out
          path: examples/chat-vinext/out
      - name: Verify downloaded Pages bundle
        if: steps.cf_auth.outputs.ready == 'true'
        run: |
          test -f examples/chat-vinext/out/index.html
          test -f examples/chat-vinext/out/_headers
      - name: Deploy to Cloudflare Pages
        if: steps.cf_auth.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy examples/chat-vinext/out --project-name=ignis --branch=main --commit-dirty=true
