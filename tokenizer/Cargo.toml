[package]
name = "ignis-tokenizer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Ray-D-Song/Ignis"
description = "Zero-JS-dependency BPE / SentencePiece WASM tokenizer and JSON Schema DFA FSM engine for Ignis WebGPU"

[lib]
crate-type = ["cdylib"]

[dependencies]
fancy-regex = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
