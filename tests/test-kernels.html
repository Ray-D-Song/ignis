<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Ignis Kernel Unit Tests</title></head>
<body>
<script type="module">
window.__runKernelTests = async (golden) => {
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  const device = await adapter.requestDevice({
    requiredFeatures: ['shader-f16', 'subgroups'],
  });

  async function compile(fname) {
    const code = await (await fetch(`/kernels/${fname}`)).text();
    const mod = device.createShaderModule({ code, label: fname });
    const info = await mod.getCompilationInfo();
    const errs = info.messages.filter((m) => m.type === 'error');
    if (errs.length) throw new Error(`${fname}: ${errs.map((e) => e.message).join('; ')}`);
    return mod;
  }

  function makeBuf(data, usage) {
    const buf = device.createBuffer({ size: Math.max(16, Math.ceil(data.byteLength / 16) * 16), usage: usage | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(buf, 0, data);
    return buf;
  }

  async function readF32(buf, count) {
    const rb = device.createBuffer({ size: count * 4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
    const enc = device.createCommandEncoder();
    enc.copyBufferToBuffer(buf, 0, rb, 0, count * 4);
    device.queue.submit([enc.finish()]);
    await rb.mapAsync(GPUMapMode.READ);
    const out = Array.from(new Float32Array(rb.getMappedRange().slice(0)));
    rb.unmap();
    rb.destroy();
    return out;
  }

  // Test 1: RMSNorm
  const rmsMod = await compile('rmsnorm.wgsl');
  const rmsPipe = device.createComputePipeline({ layout: 'auto', compute: { module: rmsMod, entryPoint: 'main' } });
  const uRms = new ArrayBuffer(16);
  new Uint32Array(uRms)[0] = golden.rms.dim;
  new Uint32Array(uRms)[1] = golden.rms.tokens;
  new Float32Array(uRms)[2] = golden.rms.eps;
  const bURms = makeBuf(uRms, GPUBufferUsage.UNIFORM);
  const bXRms = makeBuf(new Float32Array(golden.rms.x), GPUBufferUsage.STORAGE);
  const bWRms = makeBuf(new Float32Array(golden.rms.w), GPUBufferUsage.STORAGE);
  const bORms = device.createBuffer({ size: golden.rms.x.length * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  let enc = device.createCommandEncoder();
  let pass = enc.beginComputePass();
  pass.setPipeline(rmsPipe);
  pass.setBindGroup(0, device.createBindGroup({
    layout: rmsPipe.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: bURms } },
      { binding: 1, resource: { buffer: bXRms } },
      { binding: 2, resource: { buffer: bWRms } },
      { binding: 3, resource: { buffer: bORms } },
    ],
  }));
  pass.dispatchWorkgroups(golden.rms.tokens);
  pass.end();
  device.queue.submit([enc.finish()]);
  const rmsOut = await readF32(bORms, golden.rms.x.length);

  // Test 2: GEMV, GEMM4, and GEMV_Q8
  const qmmMod = await compile('quant_matmul.wgsl');
  const gemvPipe = device.createComputePipeline({ layout: 'auto', compute: { module: qmmMod, entryPoint: 'gemv_q4_g64' } });
  const gemmPipe = device.createComputePipeline({ layout: 'auto', compute: { module: qmmMod, entryPoint: 'gemm4_q4_g64' } });
  const gemvQ8Pipe = device.createComputePipeline({ layout: 'auto', compute: { module: qmmMod, entryPoint: 'gemv_q8_g64' } });

  const bQ = makeBuf(new Uint32Array(golden.qmm.quants), GPUBufferUsage.STORAGE);
  const bS = makeBuf(new Uint32Array(golden.qmm.scales), GPUBufferUsage.STORAGE);
  const bX = makeBuf(new Float32Array(golden.qmm.x), GPUBufferUsage.STORAGE);
  const bOGemv = device.createBuffer({ size: golden.qmm.M * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  const bOGemm = device.createBuffer({ size: golden.qmm.T * golden.qmm.M * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });

  const uGemv = new Uint32Array([golden.qmm.M, golden.qmm.K, 1, golden.qmm.K_pad]);
  const uGemm = new Uint32Array([golden.qmm.M, golden.qmm.K, golden.qmm.T, golden.qmm.K_pad]);
  const bUGemv = makeBuf(uGemv, GPUBufferUsage.UNIFORM);
  const bUGemm = makeBuf(uGemm, GPUBufferUsage.UNIFORM);

  enc = device.createCommandEncoder();
  pass = enc.beginComputePass();
  pass.setPipeline(gemvPipe);
  pass.setBindGroup(0, device.createBindGroup({
    layout: gemvPipe.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: bUGemv } },
      { binding: 1, resource: { buffer: bQ } },
      { binding: 2, resource: { buffer: bS } },
      { binding: 3, resource: { buffer: bX } },
      { binding: 4, resource: { buffer: bOGemv } },
    ],
  }));
  pass.dispatchWorkgroups(Math.ceil(golden.qmm.M / 4), 1, 1);
  pass.end();

  pass = enc.beginComputePass();
  pass.setPipeline(gemmPipe);
  pass.setBindGroup(0, device.createBindGroup({
    layout: gemmPipe.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: bUGemm } },
      { binding: 1, resource: { buffer: bQ } },
      { binding: 2, resource: { buffer: bS } },
      { binding: 3, resource: { buffer: bX } },
      { binding: 4, resource: { buffer: bOGemm } },
    ],
  }));
  pass.dispatchWorkgroups(Math.ceil(golden.qmm.M / 4), Math.ceil(golden.qmm.T / 4), 1);
  pass.end();
  device.queue.submit([enc.finish()]);

  const gemvOut = await readF32(bOGemv, golden.qmm.M);
  const gemmOut = await readF32(bOGemm, golden.qmm.T * golden.qmm.M);

  const bQ8 = makeBuf(new Uint32Array(golden.q8.quants), GPUBufferUsage.STORAGE);
  const bS8 = makeBuf(new Uint32Array(golden.q8.scales), GPUBufferUsage.STORAGE);
  const bOQ8 = device.createBuffer({ size: golden.qmm.M * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  enc = device.createCommandEncoder();
  pass = enc.beginComputePass();
  pass.setPipeline(gemvQ8Pipe);
  pass.setBindGroup(0, device.createBindGroup({
    layout: gemvQ8Pipe.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: bUGemv } },
      { binding: 1, resource: { buffer: bQ8 } },
      { binding: 2, resource: { buffer: bS8 } },
      { binding: 3, resource: { buffer: bX } },
      { binding: 4, resource: { buffer: bOQ8 } },
    ],
  }));
  pass.dispatchWorkgroups(Math.ceil(golden.qmm.M / 4), 1, 1);
  pass.end();
  device.queue.submit([enc.finish()]);
  const gemvQ8Out = await readF32(bOQ8, golden.qmm.M);

  // Test 3: GeGLU
  const ewMod = await compile('elementwise.wgsl');
  const gegluPipe = device.createComputePipeline({ layout: 'auto', compute: { module: ewMod, entryPoint: 'geglu' } });
  const uEw = new Uint32Array([golden.geglu.a.length, 0, 0, 0]);
  const bUEw = makeBuf(uEw, GPUBufferUsage.UNIFORM);
  const bA = makeBuf(new Float32Array(golden.geglu.a), GPUBufferUsage.STORAGE);
  const bB = makeBuf(new Float32Array(golden.geglu.b), GPUBufferUsage.STORAGE);
  const bOEw = device.createBuffer({ size: golden.geglu.a.length * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  enc = device.createCommandEncoder();
  pass = enc.beginComputePass();
  pass.setPipeline(gegluPipe);
  pass.setBindGroup(0, device.createBindGroup({
    layout: gegluPipe.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: bUEw } },
      { binding: 1, resource: { buffer: bA } },
      { binding: 2, resource: { buffer: bB } },
      { binding: 3, resource: { buffer: bOEw } },
    ],
  }));
  pass.dispatchWorkgroups(Math.ceil(golden.geglu.a.length / 256));
  pass.end();
  device.queue.submit([enc.finish()]);
  const gegluOut = await readF32(bOEw, golden.geglu.a.length);

  // Test 4: linear_f32 + rope_kv + attention
  const linMod = await compile('linear_f32.wgsl');
  const linPipe = device.createComputePipeline({ layout: 'auto', compute: { module: linMod, entryPoint: 'linear_f32' } });
  const ropeMod = await compile('rope_kv.wgsl');
  const ropePipe = device.createComputePipeline({ layout: 'auto', compute: { module: ropeMod, entryPoint: 'main' } });
  const attnMod = await compile('attention.wgsl');
  const attnPipe = device.createComputePipeline({ layout: 'auto', compute: { module: attnMod, entryPoint: 'main' } });

  const { T, start_pos, q_heads, kv_heads, head_dim, rope_dim, kv_capacity, sliding_window, is_swa, has_gate, rope_theta } = golden.attn;
  const qDim = q_heads * head_dim;
  const kvDim = kv_heads * head_dim;
  const bQkv = makeBuf(new Float32Array(golden.attn.qkv), GPUBufferUsage.STORAGE);
  const bQRot = device.createBuffer({ size: T * qDim * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  const kvBytes = kv_heads * kv_capacity * head_dim * 2;
  const bKCache = device.createBuffer({ size: kvBytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  const bVCache = device.createBuffer({ size: kvBytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  const bGate = makeBuf(new Float32Array(golden.attn.gate), GPUBufferUsage.STORAGE);
  const bAttnOut = device.createBuffer({ size: T * qDim * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });

  const uRopeAb = new ArrayBuffer(48);
  const uRopeU = new Uint32Array(uRopeAb);
  const uRopeF = new Float32Array(uRopeAb);
  uRopeU[0] = T; uRopeU[1] = start_pos; uRopeU[2] = q_heads; uRopeU[3] = kv_heads;
  uRopeU[4] = head_dim; uRopeU[5] = rope_dim; uRopeU[6] = kv_capacity; uRopeU[7] = is_swa;
  uRopeF[8] = rope_theta;
  const bURope = makeBuf(new Uint8Array(uRopeAb), GPUBufferUsage.UNIFORM);

  const uAttnAb = new ArrayBuffer(48);
  const uAttnU = new Uint32Array(uAttnAb);
  const uAttnF = new Float32Array(uAttnAb);
  uAttnU[0] = T; uAttnU[1] = start_pos; uAttnU[2] = q_heads; uAttnU[3] = kv_heads;
  uAttnU[4] = head_dim; uAttnU[5] = kv_capacity; uAttnU[6] = sliding_window; uAttnU[7] = is_swa; uAttnU[8] = has_gate;
  uAttnF[9] = 1.0 / Math.sqrt(head_dim);
  const bUAttn = makeBuf(new Uint8Array(uAttnAb), GPUBufferUsage.UNIFORM);

  enc = device.createCommandEncoder();
  pass = enc.beginComputePass();
  pass.setPipeline(ropePipe);
  pass.setBindGroup(0, device.createBindGroup({
    layout: ropePipe.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: bURope } },
      { binding: 1, resource: { buffer: bQkv } },
      { binding: 2, resource: { buffer: bQRot } },
      { binding: 3, resource: { buffer: bKCache } },
      { binding: 4, resource: { buffer: bVCache } },
    ],
  }));
  pass.dispatchWorkgroups(Math.ceil(Math.max(qDim, kvDim) / 128), T, 1);
  pass.end();

  pass = enc.beginComputePass();
  pass.setPipeline(attnPipe);
  pass.setBindGroup(0, device.createBindGroup({
    layout: attnPipe.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: bUAttn } },
      { binding: 1, resource: { buffer: bQRot } },
      { binding: 2, resource: { buffer: bKCache } },
      { binding: 3, resource: { buffer: bVCache } },
      { binding: 4, resource: { buffer: bGate } },
      { binding: 5, resource: { buffer: bAttnOut } },
    ],
  }));
  pass.dispatchWorkgroups(q_heads, T, 1);
  pass.end();
  device.queue.submit([enc.finish()]);

  const qRotOut = await readF32(bQRot, T * qDim);
  const attnOut = await readF32(bAttnOut, T * qDim);

  device.destroy();

  // Test 5: Codegen v2 Kernels (Subgroup=true AND Subgroup=false fallback):
  // INT3_G64, ShortConv K=7 (prefill+decode), QK+V-Norm + Proportional RoPE + head_dim=512 Attn + GeLU_PyTorch_Tanh
  const cg = await import('/kernels/codegen.mjs');
  const runCodegenSuite = async (useSubgroups) => {
    const adp2 = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    const dev2 = await adp2.requestDevice({
      requiredFeatures: useSubgroups ? ['shader-f16', 'subgroups'] : ['shader-f16'],
    });
    const compileCg = async (code, label) => {
      const m = dev2.createShaderModule({ code, label });
      const info = await m.getCompilationInfo();
      const errs = info.messages.filter((x) => x.type === 'error');
      if (errs.length) throw new Error(`${label} (sg=${useSubgroups}): ${errs.map((e) => `L${e.lineNum}:${e.message}`).join('; ')}`);
      return m;
    };
    const mk = (data, usage) => {
      const b = dev2.createBuffer({ size: Math.max(16, Math.ceil(data.byteLength / 16) * 16), usage: usage | GPUBufferUsage.COPY_DST });
      dev2.queue.writeBuffer(b, 0, data);
      return b;
    };
    const rd = async (buf, n) => {
      const rb = dev2.createBuffer({ size: n * 4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
      const e = dev2.createCommandEncoder();
      e.copyBufferToBuffer(buf, 0, rb, 0, n * 4);
      dev2.queue.submit([e.finish()]);
      await rb.mapAsync(GPUMapMode.READ);
      const out = Array.from(new Float32Array(rb.getMappedRange().slice(0)));
      rb.unmap(); rb.destroy();
      return out;
    };

    // Compile all codegen modules to guarantee zero WGSL syntax errors in both modes
    const mRms = await compileCg(cg.buildRmsNormWgsl({ useSubgroups }), 'cg_rmsnorm');
    const mQmm = await compileCg(cg.buildQuantMatmulWgsl({ useSubgroups }), 'cg_qmm');
    const mLin = await compileCg(cg.buildLinearF32Wgsl({ useSubgroups }), 'cg_lin');
    const mQk = await compileCg(cg.buildQkNormWgsl({ useSubgroups }), 'cg_qk');
    const mRp = await compileCg(cg.buildRopeKvWgsl(), 'cg_rope');
    const mAt = await compileCg(cg.buildAttentionWgsl({ useSubgroups }), 'cg_attn');
    const mAtD = await compileCg(cg.buildAttentionDecodeWgsl({ useSubgroups }), 'cg_attn_dec');
    const mSc = await compileCg(cg.buildShortConvWgsl(), 'cg_sconv');
    const mPle = await compileCg(cg.buildPleWgsl({ useSubgroups }), 'cg_ple');
    const mGluT = await compileCg(cg.buildFusedGluWgsl('gelu_pytorch_tanh', { useSubgroups, weightBits: 4 }), 'cg_glu_gt');
    await compileCg(cg.buildFusedGluWgsl('silu', { useSubgroups, weightBits: 3 }), 'cg_glu_q3_silu');

    // A) INT3_G64 GEMV & GEMM4
    const pQ3v = dev2.createComputePipeline({ layout: 'auto', compute: { module: mQmm, entryPoint: 'gemv_q3_g64' } });
    const pQ3m = dev2.createComputePipeline({ layout: 'auto', compute: { module: mQmm, entryPoint: 'gemm4_q3_g64' } });
    const bQ3 = mk(new Uint32Array(golden.q3.quants), GPUBufferUsage.STORAGE);
    const bS3 = mk(new Uint32Array(golden.q3.scales), GPUBufferUsage.STORAGE);
    const bX3 = mk(new Float32Array(golden.qmm.x), GPUBufferUsage.STORAGE);
    const bO3v = dev2.createBuffer({ size: golden.qmm.M * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
    const bO3m = dev2.createBuffer({ size: golden.qmm.T * golden.qmm.M * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
    const bU3v = mk(new Uint32Array([golden.qmm.M, golden.qmm.K, 1, golden.qmm.K_pad]), GPUBufferUsage.UNIFORM);
    const bU3m = mk(new Uint32Array([golden.qmm.M, golden.qmm.K, golden.qmm.T, golden.qmm.K_pad]), GPUBufferUsage.UNIFORM);

    let e2 = dev2.createCommandEncoder();
    let p2 = e2.beginComputePass();
    p2.setPipeline(pQ3v);
    p2.setBindGroup(0, dev2.createBindGroup({ layout: pQ3v.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: bU3v } }, { binding: 1, resource: { buffer: bQ3 } },
      { binding: 2, resource: { buffer: bS3 } }, { binding: 3, resource: { buffer: bX3 } },
      { binding: 4, resource: { buffer: bO3v } },
    ]}));
    p2.dispatchWorkgroups(Math.ceil(golden.qmm.M / 4), 1, 1); p2.end();

    p2 = e2.beginComputePass();
    p2.setPipeline(pQ3m);
    p2.setBindGroup(0, dev2.createBindGroup({ layout: pQ3m.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: bU3m } }, { binding: 1, resource: { buffer: bQ3 } },
      { binding: 2, resource: { buffer: bS3 } }, { binding: 3, resource: { buffer: bX3 } },
      { binding: 4, resource: { buffer: bO3m } },
    ]}));
    p2.dispatchWorkgroups(Math.ceil(golden.qmm.M / 4), Math.ceil(golden.qmm.T / 4), 1); p2.end();
    dev2.queue.submit([e2.finish()]);

    // B) ShortConv K=7: T=4 prefill then T=1 decode
    const pSc = dev2.createComputePipeline({ layout: 'auto', compute: { module: mSc, entryPoint: 'main' } });
    const Dsc = golden.sconv.dim;
    const bBcx1 = mk(new Float32Array(golden.sconv.bcx_prefill), GPUBufferUsage.STORAGE);
    const bBcx2 = mk(new Float32Array(golden.sconv.bcx_decode), GPUBufferUsage.STORAGE);
    const bCw = mk(new Float32Array(golden.sconv.w), GPUBufferUsage.STORAGE);
    const bCst = mk(new Float32Array(Dsc * 6), GPUBufferUsage.STORAGE);
    const bCout = dev2.createBuffer({ size: 4 * Dsc * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
    const bUsc1 = mk(new Uint32Array([Dsc, 4, 7, 6]), GPUBufferUsage.UNIFORM);
    const bUsc2 = mk(new Uint32Array([Dsc, 1, 7, 6]), GPUBufferUsage.UNIFORM);
    e2 = dev2.createCommandEncoder();
    p2 = e2.beginComputePass(); p2.setPipeline(pSc);
    p2.setBindGroup(0, dev2.createBindGroup({ layout: pSc.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: bUsc1 } }, { binding: 1, resource: { buffer: bBcx1 } },
      { binding: 2, resource: { buffer: bCw } }, { binding: 3, resource: { buffer: bCst } },
      { binding: 4, resource: { buffer: bCout } },
    ]}));
    p2.dispatchWorkgroups(Math.ceil(Dsc / 256), 1, 1); p2.end();
    dev2.queue.submit([e2.finish()]);
    const sconvPreOut = await rd(bCout, 4 * Dsc);

    e2 = dev2.createCommandEncoder();
    p2 = e2.beginComputePass(); p2.setPipeline(pSc);
    p2.setBindGroup(0, dev2.createBindGroup({ layout: pSc.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: bUsc2 } }, { binding: 1, resource: { buffer: bBcx2 } },
      { binding: 2, resource: { buffer: bCw } }, { binding: 3, resource: { buffer: bCst } },
      { binding: 4, resource: { buffer: bCout } },
    ]}));
    p2.dispatchWorkgroups(Math.ceil(Dsc / 256), 1, 1); p2.end();
    dev2.queue.submit([e2.finish()]);
    const sconvDecOut = await rd(bCout, Dsc);

    // C) head_dim=512 QK+V-Norm + Proportional RoPE + Attention (prefill T=3 & decode T=1 SplitKV)
    const pQk = dev2.createComputePipeline({ layout: 'auto', compute: { module: mQk, entryPoint: 'main' } });
    const pRp5 = dev2.createComputePipeline({ layout: 'auto', compute: { module: mRp, entryPoint: 'main' } });
    const pAt5 = dev2.createComputePipeline({ layout: 'auto', compute: { module: mAt, entryPoint: 'main' } });
    const g5 = golden.hd512;
    const bQkv5 = mk(new Float32Array(g5.qkv), GPUBufferUsage.STORAGE);
    const bQn5 = mk(new Float32Array(g5.q_norm), GPUBufferUsage.STORAGE);
    const bKn5 = mk(new Float32Array(g5.k_norm), GPUBufferUsage.STORAGE);
    const bQr5 = dev2.createBuffer({ size: g5.T * g5.q_heads * 512 * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
    const bKc5 = dev2.createBuffer({ size: g5.kv_heads * 16 * 512 * 2, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
    const bVc5 = dev2.createBuffer({ size: g5.kv_heads * 16 * 512 * 2, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
    const bDum = mk(new Float32Array(16), GPUBufferUsage.STORAGE);
    const bAo5 = dev2.createBuffer({ size: g5.T * g5.q_heads * 512 * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });

    const abQk = new ArrayBuffer(32);
    new Uint32Array(abQk).set([g5.q_heads, g5.kv_heads, 512, g5.T]);
    new Float32Array(abQk)[4] = 1e-6;
    new Uint32Array(abQk)[5] = 1; // norm_v=1
    new Uint32Array(abQk)[6] = 0; // skip_kv=0

    const abRp5 = new ArrayBuffer(48);
    new Uint32Array(abRp5).set([g5.T, 0, g5.q_heads, g5.kv_heads, 512, 128, 16, 0]);
    new Float32Array(abRp5)[8] = 1000000.0;
    new Uint32Array(abRp5)[9] = 1; // proportional
    new Uint32Array(abRp5)[10] = 0; // skip_kv_write=0

    const abAt5 = new ArrayBuffer(48);
    new Uint32Array(abAt5).set([g5.T, 0, g5.q_heads, g5.kv_heads, 512, 16, 0, 0, 0]);
    new Float32Array(abAt5)[9] = 1.0; // Gemma 4 scaling = 1.0

    e2 = dev2.createCommandEncoder();
    p2 = e2.beginComputePass(); p2.setPipeline(pQk);
    p2.setBindGroup(0, dev2.createBindGroup({ layout: pQk.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: mk(new Uint8Array(abQk), GPUBufferUsage.UNIFORM) } },
      { binding: 1, resource: { buffer: bQkv5 } },
      { binding: 2, resource: { buffer: bQn5 } },
      { binding: 3, resource: { buffer: bKn5 } },
    ]}));
    p2.dispatchWorkgroups(g5.q_heads + 2 * g5.kv_heads, g5.T, 1); p2.end();

    p2 = e2.beginComputePass(); p2.setPipeline(pRp5);
    p2.setBindGroup(0, dev2.createBindGroup({ layout: pRp5.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: mk(new Uint8Array(abRp5), GPUBufferUsage.UNIFORM) } },
      { binding: 1, resource: { buffer: bQkv5 } },
      { binding: 2, resource: { buffer: bQr5 } },
      { binding: 3, resource: { buffer: bKc5 } },
      { binding: 4, resource: { buffer: bVc5 } },
    ]}));
    p2.dispatchWorkgroups(Math.ceil((g5.q_heads * 512) / 128), g5.T, 1); p2.end();

    p2 = e2.beginComputePass(); p2.setPipeline(pAt5);
    p2.setBindGroup(0, dev2.createBindGroup({ layout: pAt5.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: mk(new Uint8Array(abAt5), GPUBufferUsage.UNIFORM) } },
      { binding: 1, resource: { buffer: bQr5 } },
      { binding: 2, resource: { buffer: bKc5 } },
      { binding: 3, resource: { buffer: bVc5 } },
      { binding: 4, resource: { buffer: bDum } },
      { binding: 5, resource: { buffer: bAo5 } },
    ]}));
    p2.dispatchWorkgroups(g5.q_heads, g5.T, 1); p2.end();
    dev2.queue.submit([e2.finish()]);

    const q3vOut = await rd(bO3v, golden.qmm.M);
    const q3mOut = await rd(bO3m, golden.qmm.T * golden.qmm.M);
    const hd512Out = await rd(bAo5, g5.T * g5.q_heads * 512);
    dev2.destroy();
    return { q3vOut, q3mOut, sconvPreOut, sconvDecOut, hd512Out };
  };

  const cgSg = await runCodegenSuite(true);
  const cgNoSg = await runCodegenSuite(false);
  return { rmsOut, gemvOut, gemmOut, gemvQ8Out, gegluOut, qRotOut, attnOut, cgSg, cgNoSg };
};
